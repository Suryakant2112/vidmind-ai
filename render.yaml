# Render Blueprint — deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Secret values (sync: false) are entered in the dashboard, never committed.
services:
  - type: web
    name: vidmind-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
